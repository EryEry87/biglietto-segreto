<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accesso riservato</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .box {
      width: 85%;
      max-width: 400px;
    }

    h1 {
      font-size: 28px;
      letter-spacing: 3px;
    }

    p {
      color: #bbb;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 15px;
      margin: 20px 0 10px;
      border: 1px solid #555;
      border-radius: 8px;
      background: #222;
      color: white;
      text-align: center;
      font-size: 18px;
    }

    button {
  padding: 14px 34px;
  border: 1px solid #777;
  border-radius: 2px;
  background: transparent;
  color: white;
  font-size: 13px;
  letter-spacing: 3px;
  cursor: pointer;
  transition: all 0.3s ease;
}

button:hover {
  background: white;
  color: #111;
  border-color: white;
}

    #messaggio {
  display: none;
  animation: comparsa 0.8s ease;
}

.check {
  width: 58px;
  height: 58px;
  margin: 0 auto 25px;
  border: 1px solid #777;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 26px;
  color: white;
}

.sopratitolo {
  font-size: 12px;
  letter-spacing: 4px;
  color: #999;
  margin-bottom: 12px;
}

#messaggio h1 {
  font-size: 30px;
  letter-spacing: 1px;
  margin: 10px 0 20px;
  font-weight: normal;
}

.mistero {
  margin: 30px auto;
  max-width: 330px;
  line-height: 1.7;
  color: #ccc;
}

@keyframes comparsa {
  from {
    opacity: 0;
    transform: translateY(15px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}

    .errore {
      color: #ff7777;
      display: none;
    }
  </style>
</head>

<body>

  <div class="box" id="accesso">

    <h1>ACCESSO RISERVATO</h1>

    <p>Inserisci il codice ricevuto.</p>

    <input type="password" id="codice" placeholder="Codice di accesso">

    <button onclick="controllaCodice()">ACCEDI</button>

    <p class="errore" id="errore">
      Codice non valido.
    </p>

  </div>


<div class="box" id="messaggio">

    <div class="check">✓</div>

    <p class="sopratitolo">ACCESSO AUTORIZZATO</p>

    <h1>Operazione completata.</h1>

    <p>La verifica è andata a buon fine.</p>

    <p class="mistero">
        È stato individuato un messaggio riservato
        destinato esclusivamente a te.
    </p>

    <button onclick="apriMessaggio()">CONTINUA</button>

</div>


  <script>

    function controllaCodice() {

      const codiceInserito =
        document.getElementById("codice").value;

      if (codiceInserito === "7394") {

        document.getElementById("accesso").style.display = "none";

        document.getElementById("messaggio").style.display = "block";

      } else {

        document.getElementById("errore").style.display = "block";

      }
    }


    function apriMessaggio() {

  document.getElementById("messaggio").innerHTML = `
  
    <h1>🎁 MESSAGGIO RECUPERATO</h1>

    <p>Hai superato la verifica.</p>

    <p>Ma soprattutto...</p>

    <p><strong>sei arrivato fin qui.</strong></p>

  `;

}

  </script>

</body>
</html>
