
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accesso riservato</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      overflow: hidden;
    }

    .box {
      width: 85%;
      max-width: 400px;
    }

    h1 {
      font-size: 28px;
      letter-spacing: 3px;
    }

    p {
      color: #bbb;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 15px;
      margin: 20px 0 10px;
      border: 1px solid #555;
      border-radius: 8px;
      background: #222;
      color: white;
      text-align: center;
      font-size: 18px;
    }

    .mostra-password {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 8px;
      color: #999;
      font-size: 12px;
      letter-spacing: 0.5px;
      cursor: pointer;
    }

    .mostra-password input {
      width: auto;
      margin: 0;
      padding: 0;
      accent-color: #aaa;
      cursor: pointer;
    }

    button {
      padding: 14px 34px;
      margin: 6px;
      border: 1px solid #777;
      border-radius: 2px;
      background: transparent;
      color: white;
      font-size: 13px;
      letter-spacing: 2px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    button:hover {
      background: white;
      color: #111;
      border-color: white;
    }

    #messaggio {
      display: none;
      animation: comparsa 0.8s ease;
    }

    .check {
      width: 58px;
      height: 58px;
      margin: 0 auto 25px;
      border: 1px solid #777;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      color: white;
    }

    .sopratitolo {
      font-size: 12px;
      letter-spacing: 4px;
      color: #999;
      margin-bottom: 12px;
    }

    #messaggio h1 {
      font-size: 30px;
      letter-spacing: 1px;
      margin: 10px 0 20px;
      font-weight: normal;
    }

    .mistero {
      margin: 30px auto;
      max-width: 330px;
      line-height: 1.7;
      color: #ccc;
    }

    .sequenza {
      margin: 30px auto;
      max-width: 360px;
      line-height: 2;
      color: #ccc;
      font-size: 16px;
      white-space: nowrap;
    }

    .risposte {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 25px;
    }

    .risposte button {
      width: 220px;
      margin: 6px 0;
    }

    .seconda-frase {
      margin-bottom: 70px;
    }

    .linea-segreta {
      width: 20px;
      height: 1px;
      background: #333;
      position: fixed;
      top: 28px;
      right: 28px;
      cursor: pointer;
      opacity: 0.35;
      transition: opacity 0.3s ease;
    }

    .linea-segreta:hover {
      opacity: 0.45;
    }

    .area-finale {
      position: relative;
      height: 180px;
      width: 100%;
    }

    .bottone-finale {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      white-space: nowrap;
      transition: left 0.35s ease, top 0.35s ease;
    }

    .testo-emotivo {
      max-width: 340px;
      margin: 0 auto;
      line-height: 1.8;
      color: #ccc;
      font-size: 16px;
    }

    .frase-finale {
      opacity: 0;
      animation: comparsaLenta 2s ease forwards;
    }

    .frase-finale.seconda {
      animation-delay: 3s;
    }

    .pulsante-emotivo {
      opacity: 0;
      animation: comparsaLenta 1.5s ease forwards;
      animation-delay: 5.5s;
      margin-top: 45px;
    }

    @keyframes comparsa {
      from {
        opacity: 0;
        transform: translateY(15px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes comparsaLenta {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    .errore {
      color: #ff7777;
      display: none;
    }
  </style>
</head>

<body>

  <div class="box" id="accesso">

    <h1>ACCESSO RISERVATO</h1>

    <p>Inserisci il codice ricevuto.</p>

    <input type="password" id="codice" placeholder="Codice di accesso">

    <label class="mostra-password">
      <input type="checkbox" onclick="mostraPassword()">
      Mostra password
    </label>

    <button onclick="controllaCodice()">ACCEDI</button>

    <p class="errore" id="errore">
      Codice non valido.
    </p>

  </div>


  <div class="box" id="messaggio">

    <div class="check">✓</div>

    <p class="sopratitolo">ACCESSO AUTORIZZATO</p>

    <h1>Bravo, hai indovinato la password.</h1>

    <p>Non avevo dubbi!</p>

    <p class="mistero">
      Sei quello intelligente della cucciolata. 😂
    </p>

    <button onclick="apriMessaggio()">CONTINUA</button>

  </div>


  <script>

    function mostraPassword() {

      const campo = document.getElementById("codice");

      if (campo.type === "password") {
        campo.type = "text";
      } else {
        campo.type = "password";
      }

    }


    function controllaCodice() {

      const codiceInserito =
        document.getElementById("codice").value;

      if (codiceInserito === "7777777") {

        document.getElementById("accesso").style.display = "none";

        document.getElementById("messaggio").style.display = "block";

      } else {

        document.getElementById("errore").style.display = "block";

      }
    }


    function apriMessaggio() {

      document.getElementById("messaggio").innerHTML = `

        <p class="sopratitolo">PRIMA PROVA</p>

        <h1>Trova la risposta.</h1>

        <div class="sequenza">
          4 - 12 - 3 - 19 - 8 - 15 - 2<br>
          11 - 156 - 14 - 9 - 29 - 5 - 17<br>
          10 - 13 - 4 - 18 - 55 - 21 - ?
        </div>

        <p>Qual è il numero successivo?</p>

        <div class="risposte">
          <button onclick="rispostaProva(0)">A. 0</button>
          <button onclick="rispostaProva(1)">B. Cipolla</button>
          <button onclick="rispostaProva(2)">C. 7</button>
        </div>

      `;

    }


    function rispostaProva(risposta) {

      if (risposta === 2) {

        document.getElementById("messaggio").innerHTML = `

          <div class="check">✓</div>

          <p class="sopratitolo">RISPOSTA ACCETTATA</p>

          <p class="mistero">
            So che era difficile.<br>
            <strong>Il 7 è la risposta a tutto.</strong>
          </p>

          <button onclick="secondaProva()">CONTINUA</button>

        `;

      } else {

        alert("No. 😂 Riprova.");

      }

    }


    function secondaProva() {

      document.getElementById("messaggio").innerHTML = `

        <p class="mistero seconda-frase">
          A volte la soluzione non è dove stai guardando.
        </p>

        <div class="linea-segreta" onclick="superaSecondaProva()"></div>

      `;

    }


    function superaSecondaProva() {

      document.getElementById("messaggio").innerHTML = `

        <div class="check">✓</div>

        <p class="sopratitolo">VERIFICA SUPERATA</p>

        <p class="mistero">
          Eccolo.<br>
          Sapevo che sai guardare oltre l'ovvio.
        </p>

        <button onclick="terzaProva()">CONTINUA →</button>

      `;

    }


    function terzaProva() {

      document.getElementById("messaggio").innerHTML = `

        <div class="check">✓</div>

        <p class="sopratitolo">VERIFICA COMPLETATA</p>

        <p class="mistero">
          Tutti i requisiti sono stati soddisfatti.<br>
          Il contenuto è pronto.
        </p>

        <div class="area-finale">
          <button
            id="bottoneScappa"
            class="bottone-finale"
            onclick="cliccaBottone()">
            CONTINUA
          </button>
        </div>

      `;

    }


let tentativi = 0;


function cliccaBottone() {

  const bottone = document.getElementById("bottoneScappa");

  tentativi++;

  bottone.style.position = "fixed";
  bottone.style.zIndex = "9999";

  if (tentativi === 1) {

    // Scappa sopra tutto
    bottone.style.left = "50%";
    bottone.style.top = "8%";
    bottone.style.transform = "translate(-50%, -50%) scale(1)";

  } else if (tentativi === 2) {

    // Scappa completamente in basso
    bottone.style.left = "50%";
    bottone.style.top = "92%";
    bottone.style.transform = "translate(-50%, -50%) scale(0.9)";

  } else if (tentativi === 3) {

    // Diventa piccolo e scappa in alto a destra
    bottone.style.left = "82%";
    bottone.style.top = "12%";
    bottone.style.transform = "translate(-50%, -50%) scale(0.65)";

  } else if (tentativi === 4) {

    // Torna grande e cambia completamente zona
    bottone.style.left = "18%";
    bottone.style.top = "72%";
    bottone.style.transform = "translate(-50%, -50%) scale(1.15)";

  } else {

    // Alla fine si arrende
    mostraPrefazione();

  }

}

    function mostraPrefazione() {

      document.getElementById("messaggio").innerHTML = `

        <div class="testo-emotivo">

          <p class="frase-finale">
            Quando una persona è abituata a guardare oltre l'ovvio,
            anche un semplice augurio merita un modo diverso per arrivare...
          </p>

          <p class="frase-finale seconda">
            L'ordinario va bene per le occasioni ordinarie.
            Per te, serviva qualcosa di diverso ☺️
          </p>

          <button
            class="pulsante-emotivo"
            onclick="scopriBiglietto()">
            SCOPRI IL TUO BIGLIETTO
          </button>

        </div>

      `;

    }


    function scopriBiglietto() {

  window.open("biglietto.pdf", "_blank");

    }

  </script>

</body>
</html>
