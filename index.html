<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accesso riservato</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .box {
      width: 85%;
      max-width: 400px;
    }

    h1 {
      font-size: 28px;
      letter-spacing: 3px;
    }

    p {
      color: #bbb;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 15px;
      margin: 20px 0 10px;
      border: 1px solid #555;
      border-radius: 8px;
      background: #222;
      color: white;
      text-align: center;
      font-size: 18px;
    }

.campo-password {
  position: relative;
  width: 100%;
}

.campo-password input {
  width: 100%;
  box-sizing: border-box;
  padding-right: 50px;
}

.occhio {
  position: absolute;
  right: 5px;
  top: 50%;
  transform: translateY(-50%);
  margin: 0;
  padding: 8px;
  border: 0;
  background: transparent !important;
  color: #aaa;
  font-size: 18px;
  cursor: pointer;
}

.occhio:hover {
  background: transparent !important;
  color: white;
}
    
    button {
      padding: 14px 34px;
      margin: 6px;
      border: 1px solid #777;
      border-radius: 2px;
      background: transparent;
      color: white;
      font-size: 13px;
      letter-spacing: 2px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    button:hover {
      background: white;
      color: #111;
      border-color: white;
    }

    #messaggio {
      display: none;
      animation: comparsa 0.8s ease;
    }

    .check {
      width: 58px;
      height: 58px;
      margin: 0 auto 25px;
      border: 1px solid #777;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      color: white;
    }

    .sopratitolo {
      font-size: 12px;
      letter-spacing: 4px;
      color: #999;
      margin-bottom: 12px;
    }

    #messaggio h1 {
      font-size: 30px;
      letter-spacing: 1px;
      margin: 10px 0 20px;
      font-weight: normal;
    }

    .mistero {
      margin: 30px auto;
      max-width: 330px;
      line-height: 1.7;
      color: #ccc;
    }

    .sequenza {
      margin: 30px auto;
      max-width: 360px;
      line-height: 2;
      color: #ccc;
      font-size: 16px;
      white-space: nowrap;
    }

    .risposte {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 25px;
    }

    .risposte button {
      width: 220px;
      margin: 6px 0;
    }

    @keyframes comparsa {
      from {
        opacity: 0;
        transform: translateY(15px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .errore {
      color: #ff7777;
      display: none;
    }
  </style>
</head>

<body>

  <div class="box" id="accesso">

    <h1>ACCESSO RISERVATO</h1>

    <p>Inserisci il codice ricevuto.</p>

    <div class="campo-password">
  <input type="password" id="codice" placeholder="Codice di accesso">
  <button type="button" class="occhio" onclick="mostraPassword()">👁</button>
    </div>

    <button onclick="controllaCodice()">ACCEDI</button>

    <p class="errore" id="errore">
      Codice non valido.
    </p>

  </div>


  <div class="box" id="messaggio">

    <div class="check">✓</div>

    <p class="sopratitolo">ACCESSO AUTORIZZATO</p>

    <h1>Bravo, hai indovinato la password.</h1>

    <p>Non avevo dubbi!</p>

    <p class="mistero">
      Sei quello intelligente della cucciolata. 😂
    </p>

    <button onclick="apriMessaggio()">CONTINUA</button>

  </div>


  <script>

    function controllaCodice() {

      const codiceInserito =
        document.getElementById("codice").value;

      if (codiceInserito === "7777777") {

        document.getElementById("accesso").style.display = "none";

        document.getElementById("messaggio").style.display = "block";

      } else {

        document.getElementById("errore").style.display = "block";

      }
    }


    function apriMessaggio() {

      document.getElementById("messaggio").innerHTML = `

        <p class="sopratitolo">PRIMA PROVA</p>

        <h1>Trova la risposta.</h1>

        <div class="sequenza">
          4 - 12 - 3 - 19 - 8 - 15 - 2<br>
          11 - 156 - 14 - 9 - 29 - 5 - 17<br>
          10 - 13 - 4 - 18 - 55 - 21 - ?
        </div>

        <p>Qual è il numero successivo?</p>

        <div class="risposte">
          <button onclick="rispostaProva(0)">A. 0</button>
          <button onclick="rispostaProva(1)">B. Cipolla</button>
          <button onclick="rispostaProva(2)">C. 7</button>
        </div>

      `;

    }


    function rispostaProva(risposta) {

      if (risposta === 2) {

        document.getElementById("messaggio").innerHTML = `

          <div class="check">✓</div>

          <p class="sopratitolo">RISPOSTA ACCETTATA</p>

          <p class="mistero">
            So che era difficile.<br>
            <strong>Il 7 è la risposta a tutto.</strong>
          </p>

        `;

      } else {

        alert("No. 😂 Riprova.");

      }

    }
function mostraPassword() {
  const campo = document.getElementById("codice");

  if (campo.type === "password") {
    campo.type = "text";
  } else {
    campo.type = "password";
  }
        }
  </script>

</body>
</html>
